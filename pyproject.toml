[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qpcr-analyzer"
version = "2.1.2"
description = "Lightweight browser-based qPCR data analysis with ΔCt and batch-aware ΔΔCt quantification"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jielin Yang", email = "jielin.yang@sickkids.ca" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["qPCR", "RT-PCR", "gene expression", "bioinformatics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
dependencies = [
    "nicegui>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "plotly>=5.18",
    "rapidfuzz>=3.5",
]

[project.optional-dependencies]
xls = ["xlrd>=1.2,<2.0"]
desktop = ["pywebview>=5.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
qpcr-analyzer = "qpcr_analyzer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qpcr_analyzer"]

[tool.hatch.build.targets.sdist]
include = [
    "src/qpcr_analyzer",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[project.urls]
Homepage   = "https://github.com/j-y26/py_qpcr_analyzer"
Repository = "https://github.com/j-y26/py_qpcr_analyzer"
Issues     = "https://github.com/j-y26/py_qpcr_analyzer/issues"