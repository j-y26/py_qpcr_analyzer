[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qpcr-analyzer"
version = "1.0.0"
description = "Lightweight browser-based qPCR data analysis with ΔCt and batch-aware ΔΔCt quantification"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jielin Yang", email = "jielin.yang@sickkids.ca" }]
license = { text = "MIT" }
keywords = ["qPCR", "RT-PCR", "gene expression", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "nicegui>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "plotly>=5.18",
    "rapidfuzz>=3.5",
]

[project.optional-dependencies]
xls = ["xlrd>=1.2,<2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
qpcr-analyzer = "qpcr_analyzer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qpcr_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
