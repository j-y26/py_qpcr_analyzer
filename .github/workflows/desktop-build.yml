name: Desktop Builds

# Builds standalone desktop binaries for Windows + macOS so non-technical
# users can install qPCR Analyzer without touching Python or pip.
#
# Triggers:
#   - On every published GitHub Release: artifacts are auto-uploaded to the
#     release page so they appear under "Assets".
#   - Manual dispatch from the Actions tab: produces artifacts only (no
#     release upload). Useful for rehearsals before tagging.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach artifacts to releases

jobs:
  windows:
    name: Windows installer (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop]"
          pip install "pyinstaller==6.*"

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build with PyInstaller
        shell: pwsh
        run: pyinstaller packaging/qpcr-analyzer.spec --noconfirm

      - name: Smoke-test the binary launches
        shell: pwsh
        # Start the .exe, wait briefly, kill it. We're only checking it can
        # initialise without an import error — full UI flow lives in pytest.
        run: |
          $proc = Start-Process -FilePath "dist\qpcr-analyzer\qpcr-analyzer.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) {
            Write-Error "qpcr-analyzer.exe exited prematurely with code $($proc.ExitCode)"
            exit 1
          }
          Stop-Process -Id $proc.Id -Force

      - name: Compile Inno Setup installer
        shell: pwsh
        # ISCC ships pre-installed on the windows-latest runner image.
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            packaging\installer.iss

      - name: Also produce a portable .zip (no installer needed)
        shell: pwsh
        run: |
          Compress-Archive -Path dist\qpcr-analyzer\* `
            -DestinationPath "dist\qpcr-analyzer-${{ steps.version.outputs.version }}-windows-x64-portable.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/installer/*.exe
            dist/qpcr-analyzer-*-windows-x64-portable.zip

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/*.exe
            dist/qpcr-analyzer-*-windows-x64-portable.zip

  macos:
    name: macOS .dmg (ARM64)
    # Apple Silicon only. GitHub retired the free `macos-13` (Intel) runner,
    # so Intel users should run the app from source via `pip install`.
    runs-on: macos-latest
    env:
      ARCH: arm64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop]"
          pip install "pyinstaller==6.*"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Read app version
        id: version
        run: |
          v=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        run: pyinstaller packaging/qpcr-analyzer.spec --noconfirm

      - name: Smoke-test the .app launches
        # `open -W` would block; we just exec the inner binary briefly.
        run: |
          "dist/qPCR Analyzer.app/Contents/MacOS/qpcr-analyzer" &
          PID=$!
          sleep 12
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "qpcr-analyzer exited prematurely"
            wait "$PID"
            exit 1
          fi
          kill "$PID" || true

      - name: Build .dmg
        run: |
          mkdir -p dist/installer
          create-dmg \
            --volname "qPCR Analyzer ${{ steps.version.outputs.version }}" \
            --window-size 600 380 \
            --icon-size 100 \
            --icon "qPCR Analyzer.app" 160 190 \
            --app-drop-link 440 190 \
            --no-internet-enable \
            "dist/installer/qpcr-analyzer-${{ steps.version.outputs.version }}-macos-${{ env.ARCH }}.dmg" \
            "dist/qPCR Analyzer.app" \
          || (echo "create-dmg returned non-zero; verifying output exists" \
              && ls -la "dist/installer/qpcr-analyzer-${{ steps.version.outputs.version }}-macos-${{ env.ARCH }}.dmg")

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ env.ARCH }}
          path: dist/installer/*.dmg

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.dmg
