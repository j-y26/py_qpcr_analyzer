name: Build & Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        run: pytest

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Determine publish target
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "target=pypi" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Append .devN suffix for TestPyPI
        # Real PyPI never sees this version. PEP 440 sorts X.Y.Z.devN before
        # X.Y.Z, so TestPyPI rehearsals can never collide with the real release
        # of the same number, and pip will prefer the real version when both
        # indexes are available.
        if: steps.target.outputs.target == 'testpypi'
        run: |
          python - <<'PY'
          import os, re
          run = os.environ["GITHUB_RUN_NUMBER"]
          path = "pyproject.toml"
          src = open(path, encoding="utf-8").read()
          new, n = re.subn(
              r'^version = "([0-9][^"]*)"',
              rf'version = "\1.dev{run}"',
              src, count=1, flags=re.M,
          )
          assert n == 1, "version line not patched"
          open(path, "w", encoding="utf-8").write(new)
          PY
          grep '^version' pyproject.toml
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: needs.build.outputs.target == 'testpypi'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/qpcr-analyzer
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/qpcr-analyzer
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
